name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Vite+ check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: vp check (format, lint, type check) and repo guard scripts
        run: vp run check

      # Unit tests with v8 coverage; the thresholds (test.coverage.thresholds in vite.config.ts) fail the job
      # when coverage drops. Nothing is uploaded. See docs/testing.md.
      - name: Unit tests with coverage (vp test)
        run: vp test run --coverage

  typecheck:
    name: Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    # vue-tsc also checks Vue templates, which vp check does not.
    strategy:
      fail-fast: false
      matrix:
        app: [tokyosushi, ygfliege]
    env:
      BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
      ZITADEL_AUTHORITY: https://localhost
      ZITADEL_CLIENT_ID: ci-dummy-client-id
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: vp exec nuxi typecheck

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tokyosushi, ygfliege]
    env:
      BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
      ZITADEL_AUTHORITY: https://localhost
      ZITADEL_CLIENT_ID: ci-dummy-client-id
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Build
        run: npm run build -w ${{ matrix.app }}

  e2e-mock:
    name: E2E (mock) (${{ matrix.app }}, ${{ matrix.shard }})
    # Production build of the app against the in-repo mock of tsb-service (layers/engine/e2e/mock): no secret, database
    # or Zitadel. Each shard builds the app itself (Playwright webServer) and runs one half of the suite, chromium only:
    # a brand's whole run is ~20 min on one worker (the mock holds one state, so no parallelism), a shard ~10 min.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [tokyosushi, ygfliege]
        shard: [desktop, mobile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps chromium

      - name: Run E2E tests against the mock
        run: npm run test:e2e:mock:${{ matrix.shard }} -w ${{ matrix.app }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results
          retention-days: 7

  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      BASE_URL: https://localhost
      API_BASE_URL: https://localhost/api/v1
      S3_BUCKET_URL: https://localhost
      GRAPHQL_WS_URL: wss://localhost/api/v1/graphql
      ZITADEL_AUTHORITY: https://localhost
      ZITADEL_CLIENT_ID: ci-dummy-client-id
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true

      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
