name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'ygf-v*' # ygfliege production releases (independent cadence)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. v1.0.0)'
        required: true
        type: string

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME_TSB: ${{ github.repository_owner }}/pili-shop-tsb
  IMAGE_NAME_YGF: ${{ github.repository_owner }}/pili-shop-ygf

# ── tokyosushi test image (auto on push to main) ─────────────────────────────

jobs:
  build_tokyosushi_amd64:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build tokyosushi AMD64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push tokyosushi AMD64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-amd64 \
            --build-arg BASE_URL=${{ vars.TSB_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.TSB_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.TSB_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.TSB_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.TSB_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.TSB_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.TSB_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.TSB_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TSB_TURNSTILE_SITE_KEY }} \
            --push

  build_tokyosushi_arm64:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Build tokyosushi ARM64 Image
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push tokyosushi ARM64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/arm64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-arm64 \
            --build-arg BASE_URL=${{ vars.TSB_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.TSB_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.TSB_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.TSB_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.TSB_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.TSB_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.TSB_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.TSB_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TSB_TURNSTILE_SITE_KEY }} \
            --push

  create_manifest_tokyosushi:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    name: Create tokyosushi Multi-Architecture Manifest
    runs-on: ubuntu-latest
    needs: [build_tokyosushi_amd64, build_tokyosushi_arm64]

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-amd64 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:latest-arm64

  deploy_test_tokyosushi:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: create_manifest_tokyosushi
    name: Deploy tokyosushi to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.TSB_DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.TSB_DEPLOY_TOKEN }}" \
            --fail --max-time 300

  # ── ygfliege (second brand) ──────────────────────────────────────────────────
  # Dormant until the YGF_* repo/environment vars are created (no-op otherwise).
  # Test image on push to main; production image on `ygf-v*` tags.
  # The test image is multi-arch: the home server (asahi) is arm64, so an
  # amd64-only image would not start there.

  build_ygfliege_amd64:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    name: Build ygfliege AMD64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ygfliege AMD64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=ygfliege \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-amd64 \
            --build-arg BASE_URL=${{ vars.YGF_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.YGF_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.YGF_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.YGF_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.YGF_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.YGF_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.YGF_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.YGF_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.YGF_TURNSTILE_SITE_KEY }} \
            --push

  build_ygfliege_arm64:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    name: Build ygfliege ARM64 Image
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ygfliege ARM64 Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=ygfliege \
            --platform linux/arm64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-arm64 \
            --build-arg BASE_URL=${{ vars.YGF_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.YGF_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.YGF_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.YGF_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.YGF_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.YGF_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.YGF_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.YGF_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.YGF_TURNSTILE_SITE_KEY }} \
            --push

  create_manifest_ygfliege:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    name: Create ygfliege Multi-Architecture Manifest
    runs-on: ubuntu-latest
    needs: [build_ygfliege_amd64, build_ygfliege_arm64]

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create and Push Manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-amd64 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:latest-arm64

  deploy_test_ygfliege:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.YGF_BASE_URL != ''
    needs: create_manifest_ygfliege
    name: Deploy ygfliege to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy webhook
        run: |
          curl -X POST ${{ vars.YGF_DEPLOY_WEBHOOK_URL }} \
            -H "X-Deploy-Token: ${{ secrets.YGF_DEPLOY_TOKEN }}" \
            --fail --max-time 300

  build_production_ygfliege:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ygf-v')
    name: Build ygfliege Production Image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push ygfliege Production Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=ygfliege \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}:${{ github.ref_name }} \
            --build-arg BASE_URL=${{ vars.YGF_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.YGF_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.YGF_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.YGF_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.YGF_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.YGF_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.YGF_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.YGF_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.YGF_TURNSTILE_SITE_KEY }} \
            --build-arg SENTRY_DSN=${{ vars.YGF_SENTRY_DSN }} \
            --build-arg SENTRY_ENVIRONMENT=production \
            --build-arg SENTRY_RELEASE=${{ github.ref_name }} \
            --build-arg SENTRY_ORG=${{ vars.YGF_SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.YGF_SENTRY_PROJECT }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --push

  deploy_production_ygfliege:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ygf-v')
    needs: build_production_ygfliege
    name: Deploy ygfliege to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-core
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_YGF }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            git pull --ff-only
            sops -d "secrets/ygf-${APP}.secret.enc.yaml" | sudo kubectl apply -n ygf -f -
            sudo flock -w 600 /var/lock/ygf-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install ygf-apps ./charts/tokyosushi-apps \
              --namespace ygf \
              -f ./charts/tokyosushi-apps/values.ygf.yaml \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              --atomic --timeout 5m

  # ── tokyosushi production release (tag push v*) ─────────────────────────────

  build_production_tokyosushi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build tokyosushi Production Image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.PAT }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push tokyosushi Production Image
        run: |
          docker buildx build . \
            --file Dockerfile \
            --build-arg APP=tokyosushi \
            --platform linux/amd64 \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:production \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}:${{ github.ref_name }} \
            --build-arg BASE_URL=${{ vars.TSB_BASE_URL }} \
            --build-arg API_BASE_URL=${{ vars.TSB_API_BASE_URL }} \
            --build-arg S3_BUCKET_URL=${{ vars.TSB_S3_BUCKET_URL }} \
            --build-arg GRAPHQL_WS_URL=${{ vars.TSB_GRAPHQL_WS_URL }} \
            --build-arg ZITADEL_AUTHORITY=${{ vars.TSB_ZITADEL_AUTHORITY }} \
            --build-arg ZITADEL_CLIENT_ID=${{ vars.TSB_ZITADEL_CLIENT_ID }} \
            --build-arg UMAMI_HOST=${{ vars.TSB_UMAMI_HOST }} \
            --build-arg UMAMI_WEBSITE_ID=${{ vars.TSB_UMAMI_WEBSITE_ID }} \
            --build-arg NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TSB_TURNSTILE_SITE_KEY }} \
            --build-arg SENTRY_DSN=${{ vars.TSB_SENTRY_DSN }} \
            --build-arg SENTRY_ENVIRONMENT=production \
            --build-arg SENTRY_RELEASE=${{ github.ref_name }} \
            --build-arg SENTRY_ORG=${{ vars.TSB_SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.TSB_SENTRY_PROJECT }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --push

  deploy_production_tokyosushi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build_production_tokyosushi
    name: Deploy tokyosushi to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-core
          TAG: ${{ github.ref_name }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            export SOPS_AGE_KEY_FILE=/opt/tokyosushi/.config/sops/age/keys.txt
            cd /opt/tokyosushi/tsb-infra
            git pull --ff-only
            sops -d "secrets/${APP}.secret.enc.yaml" | sudo kubectl apply -n tokyosushi -f -
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              --atomic --timeout 5m

  # ── tokyosushi rollback (manual trigger) ─────────────────────────────────────

  rollback_tokyosushi:
    if: github.event_name == 'workflow_dispatch'
    name: Rollback tokyosushi Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback via SSH (Helm)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP: tsb-core
          TAG: ${{ inputs.version }}
          REPO: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_TSB }}
        with:
          host: ${{ vars.OVH_HOST }}
          username: ${{ vars.OVH_USER }}
          key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          envs: APP,TAG,REPO
          script: |
            set -euo pipefail
            cd /opt/tokyosushi/tsb-infra
            sudo flock -w 600 /var/lock/tokyosushi-apps-helm.lock env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install tokyosushi-apps ./charts/tokyosushi-apps \
              --namespace tokyosushi \
              --reuse-values \
              --set "apps.${APP}.image.repository=${REPO}" \
              --set "apps.${APP}.image.tag=${TAG}" \
              --atomic --timeout 5m
